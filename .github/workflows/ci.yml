name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 检查新增提交内容及说明，不输出匹配文本
        if: github.event.deleted != true
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            base=$PR_BASE; tip=$PR_HEAD
          elif [[ "$BEFORE" =~ ^0+$ ]]; then
            tip=$AFTER
            # 新分支不能把默认分支的旧历史作为本次新增；首次默认分支推送除外。
            if [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]; then
              base=ROOT
            else
              base="refs/remotes/origin/$DEFAULT_BRANCH"
            fi
          else
            base=$BEFORE; tip=$AFTER
          fi
          python3 scripts/check_secrets.py --range "$base" "$tip"
      - name: 安装静态检查工具
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: 检查 Shell 脚本
        run: |
          bash -n scripts/install_linuxnet_stack.sh templates/*.sh tests/*.sh
          shellcheck scripts/install_linuxnet_stack.sh templates/*.sh tests/*.sh
      - name: 验证流量守卫判定逻辑
        run: bash tests/verify_traffic_guard.sh
      - name: 验证邮件失败重试
        run: bash tests/verify_mail_retry.sh
      - name: 运行 Python 测试
        run: python3 -m unittest discover -s tests -v
      - name: 编译检查 Python 文件
        run: python3 -m py_compile templates/traffic-guard-web.py
